[package]
name = "lizl-work-manager"
version = "0.1.0"
description = "A lightweight personal work manager"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
